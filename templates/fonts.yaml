# 폰트 및 타이포그래피 설정
# 환경영향평가서 문서 스타일

# 기본 폰트 설정
fonts:
  # 주 폰트 (본문, 제목)
  primary:
    family: "맑은 고딕"
    fallback: ["나눔고딕", "돋움", "Arial"]
    weights:
      normal: 400
      bold: 700
    styles:
      normal: "normal"
      italic: "italic"

  # 보조 폰트 (표, 캡션)
  secondary:
    family: "나눔고딕"
    fallback: ["맑은 고딕", "돋움", "Arial"]
    weights:
      normal: 400
      bold: 700

  # 코드 폰트 (좌표, 숫자)
  monospace:
    family: "Consolas"
    fallback: ["Courier New", "Monaco", "monospace"]
    weights:
      normal: 400

  # 영문 폰트
  english:
    family: "Arial"
    fallback: ["Helvetica", "sans-serif"]
    weights:
      normal: 400
      bold: 700

# 폰트 크기 체계
font_sizes:
  # 제목
  title:
    size: 18pt
    line_height: 1.3
    usage: "문서 제목, 표지"

  heading1:
    size: 16pt
    line_height: 1.4
    usage: "대제목 (1. 사업 개요)"

  heading2:
    size: 14pt
    line_height: 1.4
    usage: "중제목 (1.1 사업명)"

  heading3:
    size: 12pt
    line_height: 1.5
    usage: "소제목 (1.1.1 ...)"

  # 본문
  body:
    size: 10pt
    line_height: 1.6
    usage: "일반 본문"

  body_small:
    size: 9pt
    line_height: 1.5
    usage: "표 내용, 캡션"

  # 특수
  caption:
    size: 9pt
    line_height: 1.4
    usage: "그림, 표 캡션"

  footnote:
    size: 8pt
    line_height: 1.3
    usage: "각주"

  header_footer:
    size: 9pt
    line_height: 1.2
    usage: "머리글, 바닥글"

# 색상 설정
colors:
  # 텍스트 색상
  text:
    primary: "#212121"      # 본문 (거의 검정)
    secondary: "#757575"    # 보조 텍스트 (회색)
    disabled: "#BDBDBD"     # 비활성 텍스트
    inverse: "#FFFFFF"      # 반전 텍스트 (흰색)

  # 제목 색상
  headings:
    h1: "#2E5090"          # 진한 파랑
    h2: "#4A7BA7"          # 밝은 파랑
    h3: "#212121"          # 검정

  # 강조 색상
  emphasis:
    primary: "#2E5090"      # 주요 강조 (파랑)
    secondary: "#4A7BA7"    # 보조 강조
    accent: "#C55A11"       # 악센트 (주황)

  # 상태 색상
  status:
    success: "#2E7D32"      # 성공/적합 (초록)
    warning: "#F57C00"      # 경고 (주황)
    danger: "#C62828"       # 위험/부적합 (빨강)
    info: "#1976D2"         # 정보 (파랑)

  # 배경 색상
  background:
    primary: "#FFFFFF"      # 기본 배경 (흰색)
    secondary: "#FAFAFA"    # 보조 배경 (밝은 회색)
    light: "#F5F5F5"        # 연한 배경
    dark: "#E0E0E0"         # 진한 배경

  # 테두리 색상
  borders:
    light: "#E0E0E0"        # 연한 테두리
    medium: "#BDBDBD"       # 중간 테두리
    dark: "#757575"         # 진한 테두리

# 페이지 레이아웃
page:
  size: "A4"
  orientation: "portrait"
  width: 210mm
  height: 297mm

  margins:
    top: 25mm
    bottom: 25mm
    left: 30mm
    right: 30mm
    header: 15mm
    footer: 15mm

  spacing:
    paragraph: 6pt
    section: 12pt
    subsection: 8pt

# 제목 스타일
heading_styles:
  h1:
    font_family: "맑은 고딕"
    font_size: 16pt
    font_weight: "bold"
    color: "#2E5090"
    alignment: "left"
    spacing_before: 18pt
    spacing_after: 12pt
    keep_with_next: true
    numbering: true
    numbering_format: "1."

  h2:
    font_family: "맑은 고딕"
    font_size: 14pt
    font_weight: "bold"
    color: "#4A7BA7"
    alignment: "left"
    spacing_before: 12pt
    spacing_after: 8pt
    keep_with_next: true
    numbering: true
    numbering_format: "1.1"

  h3:
    font_family: "맑은 고딕"
    font_size: 12pt
    font_weight: "bold"
    color: "#212121"
    alignment: "left"
    spacing_before: 10pt
    spacing_after: 6pt
    keep_with_next: true
    numbering: true
    numbering_format: "1.1.1"

# 본문 스타일
body_styles:
  normal:
    font_family: "맑은 고딕"
    font_size: 10pt
    font_weight: "normal"
    color: "#212121"
    alignment: "justify"
    line_spacing: 1.6
    first_line_indent: 0pt
    spacing_after: 6pt

  emphasis:
    font_weight: "bold"
    color: "#2E5090"

  strong:
    font_weight: "bold"

  italic:
    font_style: "italic"

  underline:
    text_decoration: "underline"

# 목록 스타일
list_styles:
  bullet:
    level1:
      symbol: "•"
      indent: 18pt
      hanging: 12pt
      spacing: 3pt
    level2:
      symbol: "○"
      indent: 36pt
      hanging: 12pt
    level3:
      symbol: "■"
      indent: 54pt
      hanging: 12pt

  numbered:
    level1:
      format: "1."
      indent: 18pt
      hanging: 12pt
      spacing: 3pt
    level2:
      format: "가."
      indent: 36pt
      hanging: 12pt
    level3:
      format: "(1)"
      indent: 54pt
      hanging: 12pt

# 표 스타일
table_styles:
  default:
    font_family: "맑은 고딕"
    font_size: 9pt
    alignment: "center"
    cell_padding: 3pt
    border_width: 0.5pt
    border_color: "#BDBDBD"

    header:
      font_weight: "bold"
      background_color: "#2E5090"
      text_color: "#FFFFFF"
      alignment: "center"
      vertical_alignment: "middle"

    body:
      background_color: "#FFFFFF"
      text_color: "#212121"
      alternate_rows: true
      alternate_color: "#F5F5F5"

    caption:
      font_size: 9pt
      font_weight: "bold"
      alignment: "center"
      spacing_before: 6pt
      spacing_after: 3pt
      prefix: "[표] "

# 그림 스타일
figure_styles:
  default:
    alignment: "center"
    max_width: 6.0in
    border: false
    spacing_before: 12pt
    spacing_after: 12pt

    caption:
      font_family: "맑은 고딕"
      font_size: 9pt
      font_style: "normal"
      color: "#757575"
      alignment: "center"
      spacing_before: 6pt
      prefix: "[그림] "

  inline:
    max_width: 3.0in
    alignment: "right"
    wrap_style: "square"
    wrap_side: "left"

# 차트 스타일 (matplotlib)
chart_styles:
  default:
    figure_size: [10, 6]
    dpi: 300
    style: "seaborn-v0_8-whitegrid"

    colors:
      primary: "#2E5090"
      secondary: "#4A7BA7"
      accent: "#C55A11"
      success: "#2E7D32"
      warning: "#F57C00"
      palette:
        - "#2E5090"
        - "#4A7BA7"
        - "#C55A11"
        - "#2E7D32"
        - "#F57C00"
        - "#1976D2"

    font:
      family: "Malgun Gothic"
      size: 10
      weight: "normal"

    title:
      font_size: 12
      font_weight: "bold"
      pad: 10

    axes:
      label_size: 10
      title_size: 11
      grid: true
      grid_alpha: 0.3
      grid_color: "#CCCCCC"
      spine_width: 1.0

    legend:
      location: "best"
      font_size: 9
      frameon: true
      shadow: false
      framealpha: 0.9

    tick:
      label_size: 9
      direction: "out"
      length: 4
      width: 1

# 특수 요소 스타일
special_styles:
  # 경고/알림 박스
  alert:
    font_size: 10pt
    background: "#FFF3E0"
    border_color: "#F57C00"
    border_width: 2pt
    border_radius: 4pt
    padding: 12pt
    icon: "⚠️"
    icon_size: 14pt

  # 정보 박스
  info:
    font_size: 10pt
    background: "#E3F2FD"
    border_color: "#2196F3"
    border_width: 2pt
    border_radius: 4pt
    padding: 12pt
    icon: "ℹ️"
    icon_size: 14pt

  # 성공 박스
  success:
    font_size: 10pt
    background: "#E8F5E9"
    border_color: "#4CAF50"
    border_width: 2pt
    border_radius: 4pt
    padding: 12pt
    icon: "✅"
    icon_size: 14pt

  # 인용구
  blockquote:
    font_style: "italic"
    color: "#757575"
    indent_left: 36pt
    indent_right: 36pt
    spacing_before: 12pt
    spacing_after: 12pt
    border_left_width: 3pt
    border_left_color: "#4A7BA7"
    padding_left: 12pt

# 머리글/바닥글 스타일
header:
  enabled: true
  font_family: "맑은 고딕"
  font_size: 9pt
  color: "#757575"
  border_bottom: true
  border_color: "#E0E0E0"
  border_width: 0.5pt
  height: 15mm

  content:
    left:
      text: "{project_name}"
      alignment: "left"
    center:
      text: ""
      alignment: "center"
    right:
      text: "환경영향평가서"
      alignment: "right"

footer:
  enabled: true
  font_family: "맑은 고딕"
  font_size: 9pt
  color: "#757575"
  border_top: true
  border_color: "#E0E0E0"
  border_width: 0.5pt
  height: 15mm

  content:
    left:
      text: "{date}"
      alignment: "left"
      format: "YYYY년 M월 D일"
    center:
      text: ""
      alignment: "center"
    right:
      text: "페이지 {page} / {total_pages}"
      alignment: "right"

# 표지 스타일
cover:
  title:
    font_family: "맑은 고딕"
    font_size: 24pt
    font_weight: "bold"
    color: "#2E5090"
    alignment: "center"
    spacing_after: 24pt

  subtitle:
    font_family: "맑은 고딕"
    font_size: 18pt
    font_weight: "normal"
    color: "#4A7BA7"
    alignment: "center"
    spacing_after: 12pt

  info:
    font_family: "맑은 고딕"
    font_size: 12pt
    font_weight: "normal"
    color: "#212121"
    alignment: "center"
    spacing: 6pt

  logo:
    max_width: 3.0in
    alignment: "center"
    spacing_before: 36pt

# 참고문헌 스타일
references:
  font_family: "맑은 고딕"
  font_size: 9pt
  line_spacing: 1.3
  indent_hanging: 18pt
  spacing: 3pt
  alignment: "left"

# 각주 스타일
footnotes:
  font_family: "맑은 고딕"
  font_size: 8pt
  line_spacing: 1.2
  separator: true
  separator_width: 1.5in
  separator_height: 0.5pt
  separator_color: "#BDBDBD"
