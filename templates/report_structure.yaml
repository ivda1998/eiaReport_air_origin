      description: "사업명, 발주처, 작성일"
      required: true
    - element: "목차"
      description: "자동 생성 목차"
      required: true
    - element: "표 목차"
      description: "표 번호 및 제목"
      required: true
    - element: "그림 목차"
      description: "그림 번호 및 제목"
      required: true
    - element: "요약"
      description: "주요 내용 요약 (1-2페이지)"
      required: true

  post_content:
    - element: "참고문헌"
      description: "인용된 모든 문헌"
