    - element: "부록"
      description: "상세 자료"
      required: false

# 자동 생성 요소
auto_generated_elements:
  tables:
    prefix: "[표]"
    numbering: "sequential"  # 1, 2, 3...
    examples:
      - name: "현황 측정 결과 요약"
        columns: ["측정지점", "PM10", "PM2.5", "NO2", "SO2"]
      - name: "예측 조건 설정"
        columns: ["항목", "설정값", "비고"]
      - name: "오염물질별 최대 착지농도"
        columns: ["오염물질", "평균시간", "최대농도", "환경기준", "적합여부"]
      - name: "정온시설별 예측 농도"
        columns: ["시설명", "거리(m)", "예측농도", "환경기준", "적합여부"]
      - name: "환경기준 적합성 평가"
        columns: ["평가항목", "예측값", "기준값", "평가결과"]

  figures:
    prefix: "[그림]"
    numbering: "sequential"
    examples:
      - name: "사업 위치도"
        type: "map"
      - name: "수용점 배치도"
        type: "map"
      - name: "등농도 분포도"
        type: "contour"
        generate_per_pollutant: true
      - name: "풍향-풍속 분포"
        type: "windrose"

  charts:
    prefix: "[차트]"
    examples:
      - name: "현황 측정값 시계열"
        type: "line"
      - name: "예측값 vs 환경기준 비교"
        type: "bar"
      - name: "정온시설별 농도 분포"
        type: "scatter"

# 용어 정의
glossary:
  - term: "AERMOD"
    definition: "AMS/EPA Regulatory Model - 미국 EPA 승인 대기확산 모델"
  - term: "착지농도"
    definition: "배출원에서 배출된 오염물질이 지표면에 도달한 농도"
  - term: "정온시설"
    definition: "학교, 병원 등 정온을 필요로 하는 시설"
  - term: "환경기준"
    definition: "대기환경보전법에 따른 대기환경기준"
  - term: "PM10"
    definition: "입자크기 10㎛ 이하의 미세먼지"
  - term: "PM2.5"
    definition: "입자크기 2.5㎛ 이하의 미세먼지"

# 참고문헌 스타일
citations:
  style: "APA"
  format: "저자(연도) 형식"
  examples:
    - "환경부(2022). 대기환경기준 고시."
    - "국립환경과학원(2021). AERMOD 모델링 가이드라인."
    - "Kim et al.(2020). 도로변 대기질 영향 연구. 한국대기환경학회지, 36(2), 123-145."
