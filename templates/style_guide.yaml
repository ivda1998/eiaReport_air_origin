# 보고서 작성 스타일 가이드
# 환경영향평가서 작성 규칙 및 표준 문구

# 작성 원칙
writing_principles:
  tone: "formal"  # 공식적, 전문적
  voice: "objective"  # 객관적
  tense: "present_past"  # 현재형(사실), 과거형(수행한 작업)
  perspective: "third_person"  # 3인칭

  rules:
    - "~함, ~임 등 간결한 서술형 사용"
    - "~하였음, ~되었음 등 과거형은 수행한 작업에만 사용"
    - "~것으로 판단됨, ~것으로 예측됨 등 완곡한 표현 사용"
    - "수동태보다 능동태 우선 사용"
    - "전문용어는 첫 사용 시 영문 병기 (예: 미세먼지(PM10))"
    - "수치는 소수점 2자리까지 표시 (예외: 정수는 그대로)"

# 표준 문구 라이브러리
standard_phrases:
  # 서두
  opening:
    - "본 보고서는 {사업명}에 대한 환경영향평가서의 대기질 부분을 작성하며, AERMOD 모델링 결과와 현황측정자료를 바탕으로 사업 시행으로 인한 대기질 영향을 예측하고 평가함."
    - "특히, 정온시설에 대한 영향을 면밀히 검토하고 환경기준 달성 여부를 판단하며, 관련 선행연구 및 전문자료를 인용하여 예측 결과의 타당성을 검증함."

  # 조사 방법론
  methodology:
    survey:
      - "대기질 현황 조사는 「대기오염공정시험기준」에 준하여 실시하였음"
      - "본 평가에서는 {연도}년 현지조사 자료와 최근 5년간({시작연도}~{종료연도}년)의 문헌조사 자료를 활용하였음"
      - "현지조사는 사업구역 주변 주거지역 등 대기질 영향 예상시설을 중심으로 {개수}개 지점을 선정하여 측정하였음"

    modeling:
      - "AERMOD 모델을 이용한 대기확산 모델링"
      - "기상자료: {연도}년 {기상대명} 관측자료"
      - "지형자료: 수치표고모델(DEM) 30m 해상도"
      - "예측 및 평가 대상으로는 사업구역 주변에 분포하는 총 {개수}개소의 정온시설을 선정하였음"

  # 결과 서술
  results:
    concentration:
      - "AERMOD 모델링 결과, {오염물질}의 최대 {순위}번째 높은 {평균시간} 평균 착지농도는 {농도값} {단위}로 예측됨"
      - "최대 착지농도 발생위치: X좌표 {x좌표} m, Y좌표 {y좌표} m"
      - "이는 환경기준({기준값} {단위}, {평균시간} 평균)을 {배수}배 초과/만족하는 수준임"
      - "정온시설 중 최고 예측농도는 {시설명}({농도값} {단위})에서 나타남"

    compliance:
      - "현황농도와 예측농도 합산 결과, 모든 정온시설에서 {오염물질} 환경기준을 만족함"
      - "최대 합산농도 {농도값} {단위}는 환경기준({기준값} {단위})의 {퍼센트}% 수준으로 적합함"
      - "대부분의 정온시설에서 환경기준 이하로 예측되었으나, 일부 시설에서는 현황농도와 합산 시 기준 초과 가능성이 있음"

  # 타당성 검증
  validation:
    - "환경부({연도}) 「대기질 모델링 가이드라인」에 따르면, {내용}로 보고됨"
    - "본 예측결과({값})는 이러한 범위 내에 있어 타당한 것으로 판단됨"
    - "{저자} et al.({연도})의 연구에서는 {내용}로 보고하였으며, 본 연구결과와 유사한 경향을 보임"
    - "유사 사업인 {사업명} 환경영향평가({연도})에서는 {값}로 보고되었으며, 본 사업의 예측결과와 유사한 수준임"

  # 저감 방안
  mitigation:
    construction:
      - "비산먼지 저감을 위한 구체적 방안은 다음과 같음"
      - "공사장 진출입로 세륜시설 설치 및 운영"
      - "공사구간 방진망 설치(높이 3m 이상)"
      - "살수차 운영(1일 3회 이상)"
      - "공사장 내 비포장도로 포장 또는 표면 안정화 처리"
      - "토사 적재 시 방진덮개 설치"
      - "건설장비는 저공해 장비 사용 또는 배출가스 저감장치 부착"
      - "공사구간 주변 방진 펜스 설치"

    operation:
      - "친환경 차량 운행"
      - "공회전 제한 표지판 설치"
      - "시설 내 녹지 조성으로 완충효과 확보"
      - "배출시설 최적 방지시설 설치"
      - "정기적 대기질 모니터링 실시"

  # 결론
  conclusion:
    - "본 사업 시행으로 인한 대기질 영향은 사업구역 경계로부터 {거리}m 이내로 제한적으로 나타남"
    - "주변 정온시설에서의 예측농도는 모두 환경기준을 만족하는 것으로 예측됨"
    - "다만, 공사 중 비산먼지 발생 가능성이 있으므로, 제시한 저감방안을 철저히 이행할 필요가 있음"
    - "운영 단계에서는 배출시설에 방지시설을 설치하고 정기적으로 점검함으로써 환경기준을 지속적으로 만족할 수 있을 것으로 판단됨"
    - "본 평가는 환경부({연도}) 「환경영향평가서 작성 등에 관한 규정」 및 국립환경과학원의 「대기질 예측·평가 지침」에 따라 수행됨"

# 수치 표기 규칙
number_formatting:
  decimals: 2  # 기본 소수점 자리수

  units:
    concentration:
      - unit: "μg/m³"
        decimals: 2
        description: "미세먼지 농도"
      - unit: "ppm"
        decimals: 3
        description: "가스상 물질 농도"
      - unit: "mg/m³"
        decimals: 3
        description: "일산화탄소 농도"

    distance:
      - unit: "m"
        decimals: 0
        description: "거리"
      - unit: "km"
        decimals: 2
        description: "거리 (장거리)"

    coordinates:
      format: "TM 좌표계"
      decimals: 0
      example: "X: 201,895 m, Y: 544,385 m"

  large_numbers:
    use_comma: true
    example: "1,234,567"

# 확실성 표현
certainty_levels:
  high:
    - "~로 예측됨"
    - "~로 평가됨"
    - "~로 판단됨"

  medium:
    - "~로 예상됨"
    - "~것으로 사료됨"
    - "~가능성이 있음"

  low:
    - "~것으로 추정됨"
    - "~여지가 있음"
    - "~가능성을 배제할 수 없음"

# 비교 표현
comparison:
  exceeds:
    - "{값}로 환경기준을 초과함"
    - "환경기준({기준})의 {배수}배 수준임"
    - "환경기준 대비 {퍼센트}% 초과함"

  complies:
    - "{값}로 환경기준을 만족함"
    - "환경기준({기준})의 {퍼센트}% 수준으로 적합함"
    - "환경기준 대비 {퍼센트}% 낮은 수준임"

# 인용 규칙
citation_rules:
  format: "APA"

  government:
    format: "{기관명}({연도}). {문서명}."
    example: "환경부(2022). 대기환경보전법 시행규칙."

  journal:
    format: "{저자}({연도}). {제목}. {학술지명}, {권}({호}), {페이지}."
    example: "Kim et al.(2020). 대기질 영향 평가. 한국환경학회지, 36(2), 123-145."

  report:
    format: "{발주처}({연도}). {보고서명}. {작성기관}."
    example: "한국도로공사(2021). 고속도로 환경영향평가서. ㈜환경기술."

# 금지 사항
prohibited:
  - "구어체 사용 금지 (~요, ~네요)"
  - "주관적 감정 표현 금지"
  - "과장된 표현 금지 (~매우 심각함, ~전혀 없음)"
  - "단정적 표현 지양 (~반드시, ~절대로)"
  - "축약어 무분별 사용 금지 (첫 언급 시 풀어쓰기)"

# 품질 체크리스트
quality_checklist:
  content:
    - "모든 예측 결과에 출처(모델, 측정) 명시"
    - "환경기준 대비 평가 포함"
    - "정온시설별 영향 평가 포함"
    - "저감방안 구체적 제시"
    - "타당성 검증 자료 인용"

  format:
    - "표/그림 번호 및 제목 일관성"
    - "단위 표기 통일"
    - "수치 소수점 자리수 통일"
    - "참고문헌 형식 통일"
    - "용어 사용 일관성"

  language:
    - "문장 길이 적정 (30자 내외)"
    - "전문용어 설명 포함"
    - "능동태 우선 사용"
    - "한글-영문 병기 일관성"
    - "맞춤법 및 띄어쓰기 정확성"
