          - "국립환경과학원(2021). AERMOD 모델링 매뉴얼"

      - name: "학술논문"
        examples:
          - "Kim, S.H., Lee, J.Y., Park, M.K. (2021). 도로변 대기질 영향 연구. 한국대기환경학회지, 36(2), 123-145."
          - "Lee, H.S., Choi, W.J. (2020). 터널공사 대기질 영향. 환경영향평가, 29(4), 256-270."

      - name: "보고서"
        examples:
          - "서울시(2019). OO사업 환경영향평가서"
          - "국립환경과학원(2020). 환경영향평가 대기질 예측 표준화 연구"

# 문체 및 작성 규칙
writing_rules:
  tense:
    past: ["조사하였음", "측정되었음", "수행하였음"]
    present: ["나타남", "보임", "만족함"]
    future: ["예측됨", "예상됨", "것으로 판단됨"]

  voice:
    passive: true
    examples: ["측정되었음", "예측됨", "평가됨", "판단됨"]

  numbers:
    decimal_places: 2
    unit_spacing: true
    examples:
      - "43.35 μg/m³"
      - "201,895 m"
      - "79.4%"

  certainty:
    confident: ["~으로 평가됨", "~으로 판단됨"]
    moderate: ["~것으로 예상됨", "~것으로 사료됨"]
    cautious: ["~가능성이 있음", "~우려가 있음"]

