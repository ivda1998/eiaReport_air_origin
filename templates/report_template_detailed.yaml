          - "정온시설에 대한 영향은 미미할 것으로 예상됨"
          - "따라서 대기질 측면에서 본 사업은 환경적으로 적합한 것으로 평가됨"

  "6.0":
    title: "마. 참고문헌"
    format: "APA"
    categories:
