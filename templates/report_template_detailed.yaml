# 환경영향평가서 상세 템플릿
# 실제 PDF 샘플 분석 기반

document:
  title: "환경영향평가서 - 대기질 부문"
  section_code: "9.2.2"
  version: "2.0"
  based_on: "실제 환경영향평가서 샘플 분석"

# 표준 문구 라이브러리
standard_phrases:
  opening:
    - "본 보고서는 {사업명}에 대한 환경영향평가서의 대기질 부분을 작성하며, AERMOD 모델링 결과와 현황측정자료를 바탕으로 사업 시행으로 인한 대기질 영향을 예측하고 평가함."
    - "특히, 정온시설에 대한 영향을 면밀히 검토하고 환경기준 달성 여부를 판단하며, 관련 선행연구 및 전문자료를 인용하여 예측 결과의 타당성을 검증함."

  methodology:
    survey:
      - "대기질 현황 조사는 「대기오염공정시험기준」에 준하여 실시하였음"
      - "본 평가에서는 {연도}년 현지조사 자료와 최근 5년간({시작연도}~{종료연도}년)의 문헌조사 자료를 활용하였음"
      - "현지조사는 사업구역 주변 주거지역 등 대기질 영향 예상시설을 중심으로 {개수}개 지점을 선정하여 측정하였음"

    modeling:
      - "AERMOD 모델을 이용한 대기확산 모델링"
      - "기상자료: {연도}년 {기상대명} 관측자료"
      - "지형자료: 수치표고모델(DEM) 30m 해상도"
      - "예측 및 평가 대상으로는 사업구역 주변에 분포하는 총 {개수}개소의 정온시설을 선정하였음"

  results:
    concentration:
      - "AERMOD 모델링 결과, {오염물질}의 최대 {순위}번째 높은 {평균시간} 평균 착지농도는 {농도값} {단위}로 예측됨"
      - "최대 착지농도 발생위치: X좌표 {x좌표} m, Y좌표 {y좌표} m"
      - "이는 환경기준({기준값} {단위}, {평균시간} 평균)을 {배수}배 초과/만족하는 수준임"
      - "정온시설 중 최고 예측농도는 {시설명}({농도값} {단위})에서 나타남"

    compliance:
      - "현황농도와 예측농도 합산 결과, 모든 정온시설에서 {오염물질} 환경기준을 만족함"
      - "최대 합산농도 {농도값} {단위}는 환경기준({기준값} {단위})의 {퍼센트}% 수준으로 적합함"
      - "대부분의 정온시설에서 환경기준 이하로 예측되었으나, 일부 시설에서는 현황농도와 합산 시 기준 초과 가능성이 있음"

  validation:
    - "환경부({연도}) 「대기질 모델링 가이드라인」에 따르면, {내용}로 보고됨"
    - "본 예측결과({값})는 이러한 범위 내에 있어 타당한 것으로 판단됨"
    - "{저자} et al.({연도})의 연구에서는 {내용}로 보고하였으며, 본 연구결과와 유사한 경향을 보임"
    - "유사 사업인 {사업명} 환경영향평가({연도})에서는 {값}로 보고되었으며, 본 사업의 예측결과와 유사한 수준임"

  mitigation:
    construction:
      - "비산먼지 저감을 위한 구체적 방안은 다음과 같음"
      - "공사장 진출입로 세륜시설 설치 및 운영"
      - "공사구간 방진망 설치(높이 3m 이상)"
      - "토사 운반 시 덮개 설치 의무화"
      - "살수차 운영(1일 3회 이상)"
      - "저공해 건설기계 사용 의무화"
      - "공사장비 정기점검 및 정비 강화"

    operation:
      - "터널 내 환기시설 용량 증대"
      - "고효율 집진시설 설치"
      - "환기구 위치 최적화"
      - "친환경차량 우선통행"
      - "지능형교통시스템(ITS) 도입"

  conclusion:
    - "공사시 일시적 영향이 주를 이루며, 운영시에는 현황 수준으로 회복될 것으로 예상됨"
    - "주요 영향범위는 공사장 중심 반경 {거리}m 이내로 제한적임"
    - "환경부({연도}) 대기질 관리지침에서 제시한 허용 영향범위 내에 있음"
    - "적절한 저감방안 시행 시 사업으로 인한 대기질 영향은 환경기준 이내로 관리 가능함"
    - "따라서 대기질 측면에서 본 사업은 환경적으로 적합한 것으로 평가됨"

# 섹션별 작성 가이드
section_templates:
  "1.0":
    title: "사업 개요"
    required_content:
      - "사업명"
      - "사업자"
      - "사업 위치 (행정구역, TM좌표)"
      - "사업 목적 및 필요성"
      - "사업 규모 (면적, 예산, 기간)"
    writing_style: "객관적이고 간결하게"
    tense: "현재형"

  "2.0":
    title: "가. 현황"
    subsections:
      "2.1":
        title: "조사항목"
        required_elements:
          - type: "table"
            name: "대기질 조사항목"
            columns: ["구분", "항목", "세부 항목"]
        writing_guide:
          - "현지조사와 문헌조사 구분"
          - "법규 준거 명시"

      "2.2":
        title: "조사범위"
        required_elements:
          - "시간적 범위 (현지: 연도, 문헌: 최근 5년)"
          - "공간적 범위 (측정 지점, 정온시설)"
          - type: "figure"
            name: "조사지점 위치도"
        writing_guide:
          - "구체적인 숫자 제시"
          - "선정 근거 간략히 설명"

      "2.3":
        title: "조사방법"
        required_elements:
          - type: "table"
            name: "대기질 항목별 측정방법"
            columns: ["항목", "측정방법", "분석방법", "준거"]
        writing_guide:
          - "「대기오염공정시험기준」 명시"
          - "정도관리(QA/QC) 언급"

      "2.4":
        title: "조사결과"
        required_elements:
          - type: "table"
            name: "현지조사 결과 요약"
            columns: ["지점", "PM-2.5", "PM-10", "NO2", "SO2", "환경기준 대비"]
          - type: "table"
            name: "문헌조사 결과 (최근 5년)"
            columns: ["측정망", "연도", "PM-2.5", "PM-10", "NO2", "SO2"]
          - type: "figure"
            name: "시계열 변화 그래프"
        writing_guide:
          - "수치는 소수점 2자리"
          - "환경기준 대비 평가 필수"
          - "추세 분석 포함"
        standard_phrases:
          - "모든 항목에서 환경기준을 만족하였음"
          - "PM-2.5는 {값} μg/m³로 환경기준({기준}) 대비 {퍼센트}% 수준임"

      "2.5":
        title: "기상 현황"
        required_elements:
          - type: "table"
            name: "기상 관측 개요"
            columns: ["관측소명", "위치", "관측기간", "항목"]
          - type: "table"
            name: "월별 기상 통계"
            columns: ["월", "기온", "습도", "강수량", "풍속"]
          - type: "figure"
            name: "Wind Rose (풍배도)"
            critical: true
        writing_guide:
          - "주풍향 명시 (예: 북서풍)"
          - "평균 풍속"
          - "AERMOD 입력자료와 연계 설명"

  "3.0":
    title: "나. 영향예측 및 평가"
    subsections:
      "3.1":
        title: "예측개요"
        required_content:
          - "예측항목 (공사시/운영시 구분)"
          - "시간적 범위"
          - "공간적 범위"
          - "예측방법 (AERMOD)"
        writing_guide:
          - "명확한 구분 (공사/운영)"
          - "목표연도 명시"

      "3.2":
        title: "예측 모델"
        required_content:
          - "AERMOD 개요"
          - "모델 선정 사유"
          - "모델 특징 및 적용 범위"
        writing_guide:
          - "미국 EPA 승인 모델 강조"
          - "국내 적용 사례 언급"
          - "신뢰성 및 검증 상태"
        standard_phrases:
          - "AERMOD는 미국 EPA에서 승인한 대기확산 모델로서"
          - "국내 환경영향평가에서 널리 사용되고 있음"
          - "지형 영향을 고려할 수 있어 정확도가 높음"

      "3.3":
        title: "예측 조건"
        subsections:
          "3.3.1":
            title: "배출원 설정"
            required_elements:
              - type: "table"
                name: "배출원 입력 조건"
                columns: ["배출원", "종류", "위치(TM)", "배출량", "배출높이", "온도", "속도"]
            writing_guide:
              - "배출량 산정 근거 명시"
              - "배출 조건 상세 기술"

          "3.3.2":
            title: "기상 자료"
            required_elements:
              - type: "table"
                name: "기상자료 입력 조건"
                columns: ["관측소", "관측기간", "자료 형식", "전처리 도구"]
            writing_guide:
              - "AERMET 전처리 언급"
              - "1년간 시간별 자료 강조"

          "3.3.3":
            title: "지형 자료"
            required_content:
              - "DEM 해상도 (30m)"
              - "좌표계 (TM 또는 UTM-K)"
              - "고도 범위"

          "3.3.4":
            title: "수용점 설정"
            required_elements:
              - type: "table"
                name: "수용점 설정 조건"
                columns: ["구분", "범위", "간격", "개수"]
              - type: "figure"
                name: "수용점 배치도"
                critical: true
            writing_guide:
              - "격자 수용점과 이산 수용점 구분"
              - "정온시설 위치 강조"

      "3.4":
        title: "영향예측 대상시설"
        required_elements:
          - type: "table"
            name: "영향예측 대상 정온시설 현황"
            columns: ["번호", "시설명", "시설유형", "위치(TM)", "이격거리"]
            critical: true
          - type: "figure"
            name: "정온시설 위치도"
            critical: true
        writing_guide:
          - "총 개수 명시"
          - "시설유형별 분류 (주거/교육/의료)"
          - "가장 가까운 시설 강조"
        standard_phrases:
          - "사업구역 주변 반경 {거리}km 이내에 분포하는 총 {개수}개소의 정온시설을 선정하였음"
          - "시설유형별로는 주거시설 {개수}개소, 교육시설 {개수}개소, 의료시설 {개수}개소임"

      "3.5":
        title: "예측결과"
        dynamic: true
        generate_per_pollutant: true
        subsections:
          "3.5.1":
            title: "{오염물질} 영향예측 결과"
            required_elements:
              - type: "section"
                name: "최대 착지농도"
                content:
                  - "농도 수치 (소수점 2자리)"
                  - "발생 위치 (TM 좌표)"
                  - "환경기준 대비 평가"

              - type: "table"
                name: "주요 정온시설별 {오염물질} 예측농도"
                columns: ["순위", "시설명", "예측농도", "환경기준", "적합성"]
                critical: true

              - type: "figure"
                name: "{오염물질} 등농도 분포도"
                critical: true
                specifications:
                  - "베이스맵 포함"
                  - "정온시설 표시 (빨간 점)"
                  - "시설 번호 라벨"
                  - "등농도선 (파란색)"
                  - "범례 포함"
                  - "좌표축 레이블"
                  - "300 DPI 이상"

            writing_guide:
              - "명확한 수치 제시"
              - "위치 정보 상세히"
              - "환경기준 비교 필수"

            standard_phrases:
              - "AERMOD 모델링을 통해 산정된 {오염물질}의 주요 착지 농도 및 발생 지점은 다음과 같음"
              - "최대 착지농도는 {값} {단위}로 예측되며, 발생위치는 사업구역에서 {방향} 약 {거리}m 지점임"
              - "환경기준({기준} {단위}, {평균시간} 평균) 대비 {퍼센트}% 수준임"

          "3.5.2":
            title: "현황농도와의 비교분석"
            required_elements:
              - type: "table"
                name: "현황농도 대비 증가율"
                columns: ["시설", "현황농도", "예측농도", "합산농도", "환경기준", "적합성"]

              - type: "table"
                name: "환경기준 적합성 평가"
                columns: ["오염물질", "최대합산농도", "환경기준", "달성률(%)", "판정"]
                critical: true

            writing_guide:
              - "현황 + 예측 합산 중요"
              - "증가율 계산 및 평가"
              - "환경기준 초과 여부 명확히"

            standard_phrases:
              - "현황농도에 예측농도를 합산한 결과"
              - "최대 합산농도는 {시설명}에서 {값} {단위}로 나타남"
              - "이는 환경기준의 {퍼센트}%에 해당하며, 기준을 만족/초과함"

      "3.6":
        title: "예측결과의 타당성 검증"
        required_content:
          - "선행연구와 비교"
          - "유사사업과 비교"
          - "예측값의 합리성 논증"

        required_citations:
          - type: "guideline"
            examples:
              - "환경부(2022). 대기질 모델링 가이드라인"
              - "국립환경과학원(2021). 환경영향평가 대기질 예측 표준화 연구"

          - type: "academic"
            examples:
              - "Kim et al.(2021). 도로변 대기질 영향 연구. 한국대기환경학회지"
              - "Lee et al.(2020). 터널공사 대기질 영향 연구. 환경영향평가"

          - type: "report"
            examples:
              - "유사 사업 환경영향평가서 (연도)"

        writing_guide:
          - "최소 3개 이상 인용"
          - "인용 형식 통일"
          - "비교 분석 구체적으로"

        standard_phrases:
          - "본 예측결과의 타당성을 검증하기 위하여 선행연구 및 유사사업 사례와 비교하였음"
          - "{저자} et al.({연도})의 연구에서는 {내용}로 보고되었으며, 본 예측결과와 유사한 범위를 보임"
          - "유사 사업인 {사업명}({연도})에서는 최대 {값} {단위}로 예측되었으며, 본 사업의 {값} {단위}와 유사한 수준임"
          - "따라서 본 예측결과는 선행연구 및 유사사업 범위 내에 있어 타당한 것으로 판단됨"

  "4.0":
    title: "다. 저감방안"
    subsections:
      "4.1":
