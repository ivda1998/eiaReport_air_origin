# 섹션별 작성 규칙
# 각 섹션의 필수 요소, 작성 가이드, 예시

sections:
  # ====================================
  # 1. 사업 개요
  # ====================================
  "1":
    title: "사업 개요"
    purpose: "사업의 기본 정보 제공"

    subsections:
      "1.1":
        title: "사업명 및 사업자"
        required_elements:
          - "사업명 (정식 명칭)"
          - "사업자명 (법인명, 대표자)"
          - "사업 종류"
        length: "1-2 문단"

      "1.2":
        title: "사업 위치"
        required_elements:
          - "행정구역 (시/도, 시/군/구, 읍/면/동)"
          - "지번 또는 도로명 주소"
          - "TM 좌표"
          - type: "figure"
            name: "사업 위치도"
        length: "1-2 문단"

      "1.3":
        title: "사업 목적 및 필요성"
        required_elements:
          - "사업 추진 배경"
          - "사업 목적"
          - "기대 효과"
        length: "2-3 문단"

      "1.4":
        title: "사업 규모"
        required_elements:
          - "면적 (m², ha)"
          - "주요 시설 규모"
          - type: "table"
            name: "주요 시설 규모"
        length: "1-2 문단 + 표"

  # ====================================
  # 2. 대기질 현황
  # ====================================
  "2":
    title: "대기질 현황"
    purpose: "사업 지역의 대기질 현황 파악"

    subsections:
      "2.1":
        title: "대기질 측정망 현황"
        required_elements:
          - "측정 지점 위치 및 개수"
          - "측정 기간"
          - "측정 항목"
          - type: "table"
            name: "대기질 측정 지점"
          - type: "figure"
            name: "측정 지점 위치도"
        length: "2-3 문단 + 표 + 그림"

      "2.2":
        title: "현황 측정 결과"
        required_elements:
          - type: "table"
            name: "오염물질별 측정 결과"
            columns: ["측정지점", "PM10", "PM2.5", "NO2", "SO2", "CO", "O3"]
          - "환경기준 대비 평가"
          - type: "chart"
            name: "측정값 시계열"
        writing_guide:
          - "각 오염물질별 농도 범위 기술"
          - "환경기준 초과 여부 명시"
          - "계절별/시간대별 특성 분석"
        length: "3-5 문단 + 표 + 그림"

      "2.3":
        title: "기상 현황"
        required_elements:
          - "관측 기간 및 관측소"
          - "풍향/풍속 분포"
          - "기온/습도"
          - "강수량"
          - type: "figure"
            name: "풍배도 (Wind Rose)"
          - type: "table"
            name: "기상 요소별 통계"
        length: "2-3 문단 + 표 + 그림"

  # ====================================
  # 3. 영향 예측 방법
  # ====================================
  "3":
    title: "영향 예측 방법"
    purpose: "예측 모델 및 조건 설명"

    subsections:
      "3.1":
        title: "예측 모델"
        required_elements:
          - "AERMOD 모델 소개"
          - "모델 선정 사유"
          - "모델 적용 범위"
          - "모델 검증 자료"
        writing_guide:
          - "AERMOD는 미국 EPA 승인 모델임을 명시"
          - "국내 환경부 가이드라인 준수 명시"
          - "모델의 적합성 설명"
        length: "3-4 문단"
        standard_phrases:
          - "AERMOD(AMS/EPA Regulatory Model)는 미국 EPA에서 승인한 대기확산 모델로, 다양한 배출원 유형과 복잡한 지형 조건을 고려할 수 있음"
          - "국립환경과학원(2021) 「AERMOD 모델링 가이드라인」에 따라 수행됨"

      "3.2":
        title: "예측 조건"
        required_elements:
          - type: "subsection"
            title: "배출원 설정"
            content:
              - "배출원 종류 (점, 선, 면)"
              - "배출량 (g/s)"
              - "배출원 위치 및 높이"
              - type: "table"
                name: "배출원 설정 조건"

          - type: "subsection"
            title: "기상 자료"
            content:
              - "사용 관측소"
              - "관측 기간"
              - "자료 전처리 방법"

          - type: "subsection"
            title: "지형 자료"
            content:
              - "DEM 해상도"
              - "지형 범위"

          - type: "subsection"
            title: "수용점 설정"
            content:
              - "격자 수용점 (Grid receptor)"
              - "정온시설 수용점 (Discrete receptor)"
              - type: "table"
                name: "정온시설 현황"
              - type: "figure"
                name: "수용점 배치도"
        length: "5-7 문단 + 표 2개 + 그림 1개"

      "3.3":
        title: "예측 대상 오염물질"
        required_elements:
          - "선정된 오염물질 목록"
          - "선정 사유"
          - type: "table"
            name: "예측 대상 오염물질 및 환경기준"
        length: "2-3 문단 + 표"

  # ====================================
  # 4. 영향 예측 결과
  # ====================================
  "4":
    title: "영향 예측 결과"
    purpose: "모델링 결과 제시 및 분석"

    subsections:
      "4.1":
        title: "오염물질별 예측 결과"
        dynamic: true
        generate_per_pollutant: true
        template_id: "pollutant_result"

        required_elements:
          - type: "text"
            content: "최대 착지농도 및 발생 위치"
          - type: "text"
            content: "환경기준 대비 평가"
          - type: "table"
            name: "{오염물질} 최대 착지농도"
            critical: true
            columns: ["순위", "평균시간", "농도(단위)", "X좌표", "Y좌표", "환경기준", "기준대비(%)"]
          - type: "table"
            name: "주요 정온시설별 {오염물질} 예측농도"
            critical: true
            columns: ["시설명", "거리(m)", "예측농도", "환경기준", "적합여부"]
          - type: "figure"
            name: "{오염물질} 등농도 분포도"
            critical: true

        writing_guide:
          - "표준 문구 사용하여 최대 착지농도 서술"
          - "좌표는 TM 좌표계로 표시"
          - "환경기준 대비 배수 또는 퍼센트로 표현"
          - "정온시설별 영향 정도 평가"

        length: "3-5 문단 + 표 2개 + 그림 1개 (오염물질당)"

      "4.2":
        title: "정온시설별 영향 예측"
        required_elements:
          - type: "table"
            name: "정온시설별 오염물질 예측농도 종합"
            columns: ["시설명", "거리", "PM10", "PM2.5", "NO2", "SO2", "적합여부"]
          - "시설별 영향 정도 분석"
          - "거리별 농도 경향 분석"
        length: "3-4 문단 + 표"

      "4.3":
        title: "누적 영향 예측"
        required_elements:
          - "현황농도 + 예측농도 합산"
          - type: "table"
            name: "누적 영향 평가"
            columns: ["시설명", "현황농도", "예측농도", "합산농도", "환경기준", "적합여부"]
          - "환경기준 적합성 종합 평가"
        writing_guide:
          - "현황농도는 측정치 사용"
          - "합산농도의 환경기준 적합성 명확히 제시"
        length: "3-4 문단 + 표"

  # ====================================
  # 5. 환경기준 적합성 검토
  # ====================================
  "5":
    title: "환경기준 적합성 검토"
    purpose: "환경기준 만족 여부 종합 판단"

    subsections:
      "5.1":
        title: "대기환경기준 개요"
        required_elements:
          - type: "table"
            name: "대기환경기준"
            columns: ["오염물질", "평균시간", "기준값", "법적근거"]
          - "환경기준의 의미 및 중요성"
        length: "2-3 문단 + 표"

      "5.2":
        title: "오염물질별 적합성 평가"
        dynamic: true
        generate_per_pollutant: true
        required_elements:
          - "{오염물질} 예측농도 요약"
          - "환경기준 대비 평가"
          - "적합/부적합 판정"
        length: "2-3 문단 (오염물질당)"

      "5.3":
        title: "종합 평가"
        required_elements:
          - type: "table"
            name: "환경기준 적합성 종합"
            columns: ["평가항목", "최대예측농도", "환경기준", "기준대비(%)", "적합여부"]
          - "종합 평가 의견"
          - "부적합 시 원인 분석 및 대책"
        length: "3-4 문단 + 표"

  # ====================================
  # 6. 영향 저감 방안
  # ====================================
  "6":
    title: "영향 저감 방안"
    purpose: "대기질 영향 최소화 방안 제시"

    subsections:
      "6.1":
        title: "공사 중 저감 방안"
        required_elements:
          - "비산먼지 저감 방안 (구체적)"
          - "장비 배출가스 저감 방안"
          - "운행차량 관리 방안"
          - type: "table"
            name: "공사 중 저감방안 및 시행시기"
        writing_guide:
          - "구체적이고 실행 가능한 방안 제시"
          - "시행 시기 및 빈도 명시"
          - "저감 효율 제시 가능 시 포함"
        length: "4-6 문단 + 표"
        standard_phrases_ref: "mitigation.construction"

      "6.2":
        title: "운영 중 저감 방안"
        required_elements:
          - "배출시설 방지시설 설치"
          - "차량 운행 관리"
          - "녹지 조성 계획"
          - type: "table"
            name: "운영 중 저감방안"
        length: "3-5 문단 + 표"
        standard_phrases_ref: "mitigation.operation"

      "6.3":
        title: "모니터링 계획"
        required_elements:
          - "모니터링 지점 및 주기"
          - "측정 항목"
          - "조치 기준"
          - type: "table"
            name: "대기질 모니터링 계획"
        length: "2-3 문단 + 표"

  # ====================================
  # 7. 결론
  # ====================================
  "7":
    title: "결론"
    purpose: "평가 결과 종합 및 사업 적정성 판단"

    subsections:
      "7.1":
        title: "예측 결과 요약"
        required_elements:
          - "오염물질별 최대 농도 요약"
          - "영향 범위"
          - "정온시설 영향 요약"
        length: "3-4 문단"

      "7.2":
        title: "환경기준 적합성"
        required_elements:
          - "환경기준 만족 여부 명확히 제시"
          - "부적합 시 원인 및 대책"
        length: "2-3 문단"

      "7.3":
        title: "사업 시행의 적정성"
        required_elements:
          - "환경적 측면 종합 의견"
          - "저감방안 이행 조건 제시"
          - "사후관리 필요성"
        length: "3-4 문단"
        standard_phrases_ref: "conclusion"

  # ====================================
  # 8. 참고문헌
  # ====================================
  "8":
    title: "참고문헌"
    purpose: "인용된 모든 문헌 정리"

    required_elements:
      - "APA 스타일 인용"
      - "알파벳/가나다순 정렬"

    examples:
      - "환경부(2022). 대기환경보전법 시행규칙 [별표 7] 대기환경기준."
      - "국립환경과학원(2021). AERMOD 모델링 가이드라인."
      - "Kim, S., Lee, J., & Park, H.(2020). Impact assessment of air quality. Journal of Korean Society for Atmospheric Environment, 36(2), 123-145."

# 템플릿: 오염물질별 결과 섹션
templates:
  pollutant_result:
    structure:
      - paragraph: "opening"
        content: "AERMOD 모델링을 통해 {오염물질}의 영향을 예측한 결과는 다음과 같음."

      - paragraph: "max_concentration"
        use_standard_phrase: "results.concentration"
        variables: ["오염물질", "순위", "평균시간", "농도값", "단위", "x좌표", "y좌표"]

      - element: "table"
        name: "{오염물질} 최대 착지농도"

      - paragraph: "compliance"
        use_standard_phrase: "results.compliance"
        variables: ["오염물질", "농도값", "단위", "기준값", "퍼센트"]

      - element: "table"
        name: "주요 정온시설별 {오염물질} 예측농도"

      - element: "figure"
        name: "{오염물질} 등농도 분포도"

      - paragraph: "summary"
        content: "종합적으로, {오염물질}의 예측농도는 모든 정온시설에서 환경기준을 만족하는 것으로 평가됨."

# 작성 시 주의사항
writing_notes:
  critical_sections:
    - section: "4.1"
      note: "오염물질별로 동일한 구조로 작성. 표와 그림은 필수."
    - section: "5.3"
      note: "환경기준 적합성은 명확하게 판단. 애매한 표현 금지."
    - section: "6.1"
      note: "저감방안은 구체적으로. '철저히 관리', '노력함' 등 추상적 표현 지양."

  common_mistakes:
    - "정온시설 예측농도 표 누락"
    - "등농도 분포도 미첨부"
    - "환경기준 명시 누락"
    - "저감방안이 너무 추상적"
    - "참고문헌 형식 불일치"
