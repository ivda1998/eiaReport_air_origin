# 용어 정의
glossary:
  - term: "AERMOD"
    definition: "AMS/EPA Regulatory Model - 미국 EPA 승인 대기확산 모델"
  - term: "착지농도"
    definition: "배출원에서 배출된 오염물질이 지표면에 도달한 농도"
  - term: "정온시설"
    definition: "학교, 병원 등 정온을 필요로 하는 시설"
  - term: "환경기준"
    definition: "대기환경보전법에 따른 대기환경기준"
